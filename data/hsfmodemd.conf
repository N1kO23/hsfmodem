# hsfmodemd settings: any long option of "hsfmodemd --help" as
# "name = value", or "name = yes" for options without a value.
# Options on the command line override these.

# hsfmodemd starts as root (to open the codec and set up /run/hsfmodem) and
# then runs as this user. It needs the "audio" group for the codec and must
# be a member of the serial port's group.
user = hsfmodem
group = dialout

# Real-time scheduling for the modem threads (priority 1-98; default 40,
# below threaded interrupt handlers). With CONFIG_RT_GROUP_SCHED the
# service's cgroup also needs a real-time budget.
#realtime = 40

# Save the codec dialogue, e.g. for a bug report or a replay test.
#backend = record:/var/lib/hsfmodem/codec.rec

#verbose = yes
